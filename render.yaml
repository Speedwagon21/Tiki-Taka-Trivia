services:
  - type: web
    name: tiki-taka-trivia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render sits behind a proxy: without this every player would share one address and one connection limit
      - key: TRUST_PROXY
        value: "1"
